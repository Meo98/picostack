<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img" aria-label="PicoStack">
  <defs>
    <linearGradient id="pcb1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b7f4d"/><stop offset="1" stop-color="#0f5e37"/>
    </linearGradient>
    <linearGradient id="pcb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23985e" stop-opacity="0.95"/><stop offset="1" stop-color="#146b40"/>
    </linearGradient>
    <linearGradient id="pcb3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2cb06f"/><stop offset="1" stop-color="#1b7f4d"/>
    </linearGradient>
  </defs>
  <!-- three stacked boards, isometric -->
  <g transform="translate(18,20)">
    <!-- bottom board -->
    <g transform="translate(0,64)">
      <polygon points="10,22 78,0 146,22 78,44" fill="url(#pcb1)" stroke="#0a4227" stroke-width="2"/>
      <polygon points="10,22 10,34 78,56 78,44" fill="#0c4a2c"/>
      <polygon points="146,22 146,34 78,56 78,44" fill="#0a3d24"/>
      <circle cx="78" cy="22" r="5" fill="#d8b34a"/>
    </g>
    <!-- middle board -->
    <g transform="translate(0,32)">
      <polygon points="10,22 78,0 146,22 78,44" fill="url(#pcb2)" stroke="#0a4227" stroke-width="2"/>
      <polygon points="10,22 10,34 78,56 78,44" fill="#0f5533"/>
      <polygon points="146,22 146,34 78,56 78,44" fill="#0c452a"/>
      <rect x="60" y="14" width="36" height="16" rx="2" fill="#20242b" transform="skewY(-8)" opacity="0.9"/>
    </g>
    <!-- top board -->
    <g>
      <polygon points="10,22 78,0 146,22 78,44" fill="url(#pcb3)" stroke="#0a4227" stroke-width="2"/>
      <polygon points="10,22 10,34 78,56 78,44" fill="#127043"/>
      <polygon points="146,22 146,34 78,56 78,44" fill="#0e5a36"/>
      <!-- pin header hint -->
      <g fill="#d8b34a">
        <circle cx="40" cy="20" r="2.4"/><circle cx="52" cy="16" r="2.4"/>
        <circle cx="64" cy="12" r="2.4"/><circle cx="76" cy="8"  r="2.4"/>
        <circle cx="48" cy="24" r="2.4"/><circle cx="60" cy="20" r="2.4"/>
        <circle cx="72" cy="16" r="2.4"/><circle cx="84" cy="12" r="2.4"/>
      </g>
    </g>
    <!-- stack pins -->
    <g stroke="#8a929e" stroke-width="3" stroke-linecap="round">
      <line x1="24" y1="30" x2="24" y2="96"/>
      <line x1="132" y1="30" x2="132" y2="96"/>
    </g>
  </g>
  <!-- wordmark -->
  <g font-family="'DejaVu Sans', Verdana, sans-serif" font-weight="bold">
    <text x="200" y="92" font-size="56" fill="#1b7f4d">Pico</text><text x="330" y="92" font-size="56" fill="#20242b">Stack</text>
    <text x="202" y="122" font-size="16" font-weight="normal" fill="#5c6570">stackable · contract-driven · open hardware</text>
  </g>
</svg>
