name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all suites
        run: python3 tests/run_all.py
